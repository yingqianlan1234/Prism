name: macOS port Windows frontend follow-up
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3c468bc5c28e8780fc337fe438371e94c38f8f2e
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify QQ and WeChat authorization UI
        run: node src/qq-login.test.mjs
      - name: Rerun the desktop shortcut scenario independently
        if: ${{ !cancelled() }}
        run: node src/desktop-p2a.test.mjs
      - name: Verify the local library independently
        if: ${{ !cancelled() }}
        run: node src/local-library-p2b.test.mjs

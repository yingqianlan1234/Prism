name: Verify the Windows desktop executable layout
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9cbd41c4cc576d6cd02fd1867bdca05b15ca4905
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compile and test the Windows desktop executable
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

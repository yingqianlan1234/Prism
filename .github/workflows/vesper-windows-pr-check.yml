name: macOS port Windows regression
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3c468bc5c28e8780fc337fe438371e94c38f8f2e
          persist-credentials: false
      - name: Record revision and toolchain
        run: |
          git rev-parse HEAD
          node --version
          rustc --version
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Run frontend suite
        run: npm test
      - name: Compile and test Windows Rust backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if (-not (Test-Path dist/index.html)) {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --locked --manifest-path src-tauri/Cargo.toml

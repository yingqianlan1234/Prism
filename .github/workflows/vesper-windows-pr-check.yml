name: Verify final Windows frontend suite for PR two
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 888cb88a6fd1d380d95a7b717fe6f16f9b18457f
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
      - run: npm test

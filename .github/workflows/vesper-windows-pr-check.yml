name: Verify Windows updater integration after syncing main
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 915b10a8dc782b81044f39317e55b259b9ae6ce3
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compile and test the Windows desktop executable
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

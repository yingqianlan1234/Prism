name: Verify the final desktop integration and session fix
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ea9c5400485f438c20a4e9d65ae7e165da37c6d3
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
        id: install
      - name: Verify three-source continuity and account restore on Windows
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path dist/index.html)) {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node src/custom-playlists-settings-integration.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node src/qq-playback-state-integration.test.mjs
      - name: Compile and test the Windows desktop executable
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

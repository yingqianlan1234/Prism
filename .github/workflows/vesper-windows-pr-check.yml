name: Verify final Windows frontend suite for PR two
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 07aa78c4fe5097218eb9b8f48a56d4a75df9ece6
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
      - run: npm test

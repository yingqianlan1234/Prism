name: Windows shortcut baseline on main
on:
  push:
    branches: [ci/macos-wechat-windows-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c7a7e7a7b5a507d21c7adea3d6d5d1ea4ded3a94
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node src/desktop-p2a.test.mjs
